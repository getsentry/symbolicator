[package]
name = "symbolicator-service"
version = "26.8.0"
authors = ["Sentry <hello@getsentry.com>"]
edition = "2024"
license-file = "../../LICENSE.md"

[dependencies]
anyhow = { workspace = true }
async-compression = { workspace = true, features = ["tokio", "brotli", "gzip", "zlib", "zstd"] }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-types = { workspace = true }
aws-smithy-xml = { workspace = true }
bytes = { workspace = true }
cab = { workspace = true }
chrono = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
gcp_auth = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
idna = { workspace = true }
ipnetwork = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
metrics-exporter-dogstatsd = { workspace = true }
moka = { workspace = true }
pin-project-lite = { workspace = true }
proguard = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = [
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "json",
    "stream",
    "hickory-dns",
    "socks",
] }
sentry = { workspace = true }
serde = { workspace = true }
serde-vars = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
symbolic = { workspace = true, features = [
    "cfi",
    "common-serde",
    "debuginfo",
    "symcache",
] }
symbolicator-sources = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
sha-1 = { workspace = true }
symbolicator-test = { workspace = true }
insta = { workspace = true }
